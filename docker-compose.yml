services:
  web-tests:
    image: mcr.microsoft.com/playwright:v1.50.1-jammy
    container_name: depin-web-tests
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - VITE_API_BASE_URL=http://depin-backend:8080/api/v1
    command: >
      bash -c "npm install && npx playwright test e2e/auth.spec.ts"
    networks:
      - backend_depin-network

networks:
  backend_depin-network:
    external: true
